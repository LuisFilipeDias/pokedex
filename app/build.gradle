plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id 'jacoco'
    id 'org.jetbrains.kotlinx.kover'
    id 'com.google.protobuf'
}

android {
    compileSdk 35

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
    defaultConfig {
        namespace "com.ctw.ctwpokedex"
        applicationId = namespace
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "com.ctw.pokedex.CustomTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    hilt {
        enableTransformForLocalTests = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            pseudoLocalesEnabled true
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
    testOptions {
        animationsDisabled = true
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
    hilt {
        enableTransformForLocalTests = true
    }

    protobuf {
        protoc {
            artifact = "com.google.protobuf:protobuf-gradle-plugin:0.9.1"
        }
        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    java {
                        option 'lite'
                    }
                }
            }
        }
    }
}

dependencies {
// Room runtime library
    implementation "androidx.room:room-runtime:2.6.1"
    implementation 'androidx.compose.ui:ui-test-junit4-android:1.7.8'
    implementation 'com.google.dagger:hilt-android-testing:2.50'
    implementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.50'

// Room compiler for annotation processing (use kapt for Kotlin)
    kapt "androidx.room:room-compiler:2.6.1"

// Room extension for coroutines (optional, for coroutine support)
    implementation "androidx.room:room-ktx:2.6.1"

// Room testing library (for unit tests and database tests)
    testImplementation "androidx.room:room-testing:2.6.1"

//noinspection GradleDependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.21"

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    implementation "androidx.multidex:multidex:2.0.1"

// Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.10.0"
    implementation "com.squareup.retrofit2:converter-gson:2.10.0"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.10.0"

// Glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

// Rx
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"

// Activity KTX
    implementation 'androidx.activity:activity-ktx:1.10.0'

// Lottie
    implementation 'com.airbnb.android:lottie:6.3.0'

// Core Test Library
    testImplementation "androidx.test:core:1.6.1"
    implementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

// UI Testing
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

// Dagger-Hilt
    implementation "com.google.dagger:hilt-android:2.50"
    kapt "com.google.dagger:hilt-compiler:2.50"

// Logs
    implementation 'com.jakewharton.timber:timber:5.0.1'

// Coroutines & MockK
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "io.mockk:mockk:1.13.16"

// Compose
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation "androidx.compose.foundation:foundation:1.7.8"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

// Preview & Debugging
    implementation "androidx.compose.compiler:compiler:1.5.15"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.8"
    debugImplementation "androidx.compose.ui:ui-tooling:1.7.8"

    testImplementation "androidx.compose.ui:ui-test-junit4:1.7.8"
    androidTestImplementation "androidx.compose.ui:ui-test-manifest:1.7.8"

    implementation 'com.google.protobuf:protobuf-java:3.24.0'
    implementation 'com.google.protobuf:protoc:3.24.0'
    implementation 'com.google.protobuf:protobuf-gradle-plugin:0.9.1'
}

def excludes = [
        '**/R.class',
        '**/R$*.class',
        '**/*$ViewInjector**.*',
        '**/BuildConfig*.*',
        '**/Manifest**.*',
        '**/*Test**.*',
        'android/**/**.*',
]

def includes = [
        'com/ctw/ctwpokedex/**'
]

tasks.register('jacocoReport', JacocoReport) {
    dependsOn "test"
    reports {
        html { enabled true }
    }

    // generated classes
    classDirectories.from = fileTree(
            dir: "$buildDir/intermediates/classes/debug",
            excludes: excludes,
            includes: includes
    ) + fileTree(
            dir: "$buildDir/tmp/kotlin-classes/debug",
            excludes: excludes,
            includes: includes
    )

    executionData.from = files("$buildDir/jacoco/testDebugUnitTest.exec")
}
