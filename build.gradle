// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Update Android Gradle Plugin to the latest stable version
        classpath "com.android.tools.build:gradle:8.1.4"  // Latest AGP version

        // Update Kotlin Gradle Plugin to the latest stable version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10"

        classpath "com.google.dagger:hilt-android-gradle-plugin:2.50"  // Hilt Plugin classpath

        classpath "androidx.compose.compiler:compiler:1.5.3"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id("org.jetbrains.kotlinx.kover") version "0.9.1" // Use latest version
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter() // Warning: this repository is going to shut down soon
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}